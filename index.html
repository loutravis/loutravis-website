      { title: "Digital Eye Strain", client: "AbbVie, via Die Antwort AG", year: "2026", disc: "Key visual · AI imagery · Layout", bg: "#0E3A5B", ink: "#9FE6FF", note: "Advertising for prescription medicines in Switzerland may only be addressed to healthcare professionals. Product names and product information on this page are therefore obscured.", focus: "The focus was on developing an independent digital visual language from an existing campaign world — rich in detail, technology-driven and attention-grabbing.", cover: "media/8c6f398617b851a2e206c176d8e898b6.webp", meta: [["Client", "AbbVie AG"], ["Task", "Key visual & layout adaptation"], ["Agency", "Die Antwort AG"], ["Year", "2026"]], paras: ["Based on an existing campaign, I created a new digital adaptation for use on screens. The challenge was to pick up the character of the original and translate it into an independent, technology-driven visual world.", "The central motif was developed with AI, then composed, refined and finalised in Photoshop. Individual miniature scenes were generated separately, built with Flow, upscaled with ComfyUI and integrated into the overall composition.", "Digital number worlds, light accents and graphic overlays were used deliberately to condense the motif, create visual depth and strengthen its screen character."], tasks: ["Visual adaptation of an existing campaign world for the digital screen context", "Development of an AI-based key visual", "Creation, upscaling and integration of individual miniature scenes", "Image composition, retouching and finishing in Photoshop", "Design of digital overlays, number worlds and light accents", "Preparation of detail crops and layout applications for the portfolio", "Layout adaptations with the final visual"], imgs: [["media/fe49626c1909fe3a624959baf45fd53a.mp4", "Campaign film", 1.778, 1], ["media/9bce07fa1f1d16e8dd7ffff21cdec744.webp", "Key visual, miniature scenes", 1.342], ["media/3171c99ebc04f4e00b5694d14097aa72.webp", "Detail", 1.342], ["media/8c6f398617b851a2e206c176d8e898b6.webp", "Key visual", 1.342], ["media/053b61cdfb792123b12ecc51baf25516.webp", "Flyer, product information obscured", 1.5]] },
      { title: "Grossstadt-Dschungel", client: "Grün Stadt Zürich, via Die Antwort AG", year: "2025", disc: "Employer branding · Execution · Shoot", bg: "#7AB929", ink: "#0F2A12", focus: "My focus was on carrying the jungle look consistently from the shoot into every format, from billboard to sticker to the safari van.", cover: "media/303f0b1404be391acc51daed50d55371.webp", meta: [["Client", "Grün Stadt Zürich"], ["Task", "Execution, assistant on the photo shoot"], ["Agency", "Die Antwort AG"], ["Year", "2025"]], paras: ["Gardening is on trend, but hardly as a career choice. Grün Stadt Zürich is feeling the skills shortage: fewer applications, many upcoming retirements and a growing need for staff. The job had to be told in a new way: modern, attractive, surprising and clearly different from other city employers.", "«Zurich is getting greener» became an adventure: the «Big City Jungle». Real employees stand in the middle of the action, earthy, sweaty, with pickaxe, shovel and even a machete. The look nods to series like «The Walking Dead»: authentic, slightly exaggerated and far from the usual administrative image. The campaign runs across Zurich on posters, as a display campaign and on social media.", "I assisted on the photo shoot and handled the execution: adapting the key visuals to all formats and media, from out-of-home and digital to the giveaways, stickers and the striped safari van."], tasks: ["Execution of the campaign across print, out-of-home, digital and social", "Assistant on the photo shoot"], imgs: [["media/a3279866fafbe33ca03c900a97fa6d1d.webp", "Billboard", 1.778], ["media/303f0b1404be391acc51daed50d55371.webp", "Poster at the station", 1.778], ["media/d16c1e0c40c2cbc42fdff3c318304f34.webp", "Posters", 1.778], ["media/cc980a63a328e1a723e6b5e8b460b540.mp4", "Spots", 1.778, 1], ["media/3925ab1b0a72c4967d66f1659b569fc9.mp4", "Interview", 1.778, 1], ["media/dcb8b06add0931c3567f4b283c3b2603.webp", "Giveaways", 1.778], ["media/85508000d6b6539797c177fbe6e       { title: "Rennie Diethelm", client: "Rennie Diethelm Styling, via Private", year: "2026", disc: "Brand identity · Web design & build", bg: "#0000FF", ink: "#FFFFFF", url: "https://www.renniediethelm.ch", focus: "My focus was on giving 30 years of styling experience a calm, confident stage, where the work speaks first and the brand blue does the rest.", cover: "media/68cfe8a849005cef862d02a73b06062f.webp", meta: [["Client", "Rennie Diethelm, Styling"], ["Task", "Brand identity, UI/UX design, web build"], ["Agency", "Private"], ["Year", "2026"]], paras: ["Rennie Diethelm has been styling people, products and stories for advertising and brand communication for over 30 years. Together with her casting agency Find a Face, she offers styling and casting from one hand. What she needed was a presence that feels as sure-footed as she is on set.", "I developed the complete brand: the typographic wordmark, the electric blue as a single, confident colour, and the tone of voice for her communication. The identity stays deliberately reduced, so her shoots for brands like Puma and Porsche carry the page.", "I then designed the website from the first wireframe to the last detail, UI and UX, and built it myself: a sweeping blue curve as the signature, a clear project overview, references from creative directors and photographers, and a mobile version that works just as well on set as at the desk."], tasks: ["Logo and wordmark", "Colour palette and brand communication", "UI/UX design of the website", "Technical build and launch", "Mobile version"], imgs: [["media/ada0c556dbb14cfde7f60e39c224140b.mp4", "Screen recording, desktop and mobile", 1.778, 1]] },
      { title: "Hair & Skin", client: "Hair & Skin Medical AG, in-house", year: "2021–24", disc: "Design lead · Out of home · Shoots · Windows", bg: "#F4EFE8", ink: "#141414", cover: "media/7869c6c1cc95cadeb3cd7c63672157e5.webp", meta: [["Client", "Hair & Skin Medical AG"], ["Task", "Design lead, aka art direction"], ["Agency", "In-house"], ["Year", "2021 – 2024"]], paras: ["In my role I was responsible for developing the visual communication and the brand identity further. My main tasks included creating and editing flyers, images, mega posters, illustrations, videos, animations, digital ads, print materials and merchandise.", "I also edited images for use across a range of marketing media, online and offline.", "I executed brand and performance campaigns in close collaboration with the performance and social media marketing team, and helped organise and run photo shoots and video productions, including casting the models.", "In coordination with the expansion team, I also designed the window displays for the clinics."], tasks: ["Evolving the CI/CD", "Campaign execution, digital and print", "Window branding and image selection for the clinics", "Image selection from photo shoots with the team", "Image editing", "Video editing, colour grading, sound design", "Animations (logo, digital posters, banners, web illustrations)", "Illustrations for website and flyers"], imgs: [["media/9c80bede495eb32824d93fdff966098e.mp4", "Logo animation", 1.778, 1], ["media/7869c6c1cc95cadeb3cd7c63672157e5.webp", "Tram, in traffic", 1.852], ["media/11690a1f0c0cf895163345ff11e17bfa.webp", "Tram, street view", 1.5], ["media/7656a61b474142127af096b668965682.webp", "Tram interior", 1.5], ["media/f1e4c8733d74f56f05652b97ad25be98.webp", "Tram branding", 1.5], ["media/550a506972742c4cec16f656e3509bad.webp", "Tram stop and interior", 1.5], ["media/165342d84ce5f677300297341cc84604.webp", "Window display", 1.486], ["media/69c8a15993ec1a1154507a8aec605f2a.webp", "Doormat", 1.5], ["media/c9bf142c2b9       { title: "Puritics", client: "Puritics, via FCB Zürich", year: "2020", disc: "Packaging · Naming · Logo", bg: "#24382B", ink: "#E9C46A", cover: "media/42ccede5c3a23160d3bb03675a668393.webp", meta: [["Client", "Puritics"], ["Task", "Graphic and packaging design"], ["Agency", "FCB Zürich"], ["Year", "2020"]], paras: ["I was tasked with designing the packaging for a new dietary supplement.", "For the following packs, I helped find the name «b.biotic». I also created two concepts, each with its own logo and packaging design."], tasks: [], pairs: true, imgs: [["media/d5ccac37a26c18dfb8951aa0d4ef30bf.webp", "Concept 1, box", 1.136], ["media/9695bc4cf5a72f5906845d05e76a4412.webp", "Concept 1, pill bottle", 0.907], ["media/42ccede5c3a23160d3bb03675a668393.webp", "Concept 2, dark, box", 1.136], ["media/ec2c71036f222b2fd07fc6ebe6129d6c.webp", "Concept 2, dark, pill bottle", 0.907], ["media/2e2c07b362aa44ca8fd744e372f6be72.webp", "Concept 2, light, box", 1.136], ["media/cadc9ddb3e7457c5503c4a7acc2b481a.webp", "Concept 2, light, pill bottle", 0.907]] },

      { title: "Technoabteil", client: "Technoabteil, via Private", year: "2018–20", tag: "Personal", disc: "CI/CD + Communication", bg: "#0B0B0B", ink: "#EDEDED", cover: "media/c64774ba87ad10be56162437a3c46906.webp", meta: [["Client", "Technoabteil"], ["Task", "Graphic design, head of graphics"], ["Agency", "Private"], ["Year", "2018 – 2020"]], paras: ["A friend brought me to «Technoabteil» in 2018. With three fellow organisers we planned and ran successful parties with techno at «120–150 beats per minute».", "This private initiative was also my biggest client. I designed the flyers for many events and produced After Effects animations.", "When we at Technoabteil started thinking about an independent label for so-called day raves, I designed a logo for it too (Casa del Sueño).", "I have since left «Technoabteil»."], tasks: [], imgs: [["media/9e93f1df13a03deb1a3f2106fc5eb4f1.webp", "Technoabteil logo", 1.778], ["media/8ce88448775582f9ca2d2190f1b087ad.webp", "Flyer", 1.778], ["media/ee993065ff0b58f65dd2367294026ee5.webp", "Flyer", 1.778], ["media/c64774ba87ad10be56162437a3c46906.webp", "Flyer, Outer Space", 1.778], ["media/604ae8303407d09b1789063f79e20f96.webp", "Casa del Sueño logo", 1.778]] },

      { title: "Theater Rigiblick", client: "Theater Rigiblick, via FCB Zürich", year: "2018–21", disc: "Flyers · Programmes", bg: "#B3262E", ink: "#F6E8E1", cover: "media/cd4fd1db9cbe450109c59364a4dbaf09.webp", meta: [["Client", "Theater Rigiblick"], ["Task", "Flyer design"], ["Agency", "FCB Zürich"], ["Year", "2018 – 2021"]], paras: ["Every time Theater Rigiblick plans a new production, we at FCB Zürich get to design the matching flyers and programme. Each time, the agency held an in-house competition, and the client made the final pick.", "The flyers shown here are all designs I submitted and created."], tasks: [], imgs: [["media/18affcfe136b6f06d0e2a3b456a0ba84.webp", "Flyer", 1.778], ["media/cd4fd1db9cbe450109c59364a4dbaf09.webp", "Flyer, Like a Virgin", 1.778], ["media/014462c344655d75599f2ddf368a24c8.webp", "Flyer, Monty Python", 1.778], ["media/1278fe9ebfc064f7fd5dc9d1d9345e50.webp", "Flyer", 1.778]] },

  caseState(p, mx, my, vw, vh, cy, sMax) {
    const clamp = (v) => Math.max(0, Math.min(1, v));
    const ph = (a, b) => clamp((p - a) / (b - a));
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    const turn = ease(ph(0, 0.32)), lid = ease(ph(0.5, 0.62)), out = ease(ph(0.56, 0.7));
    const sp = ph(0.68, 0.79), spin = sp < 0.5 ? 4 * sp * sp * sp : 1 - Math.pow(-2 * sp + 2, 3) / 2;
    let zoom = Math.pow(ph(0.76, 0.88), 2.2);
    const still = 1 - spin;
    const RM = !!this.reduce;
    const txt = ph(0.1, 0.52);
    const H = Math.max(vh, this.minH == null ? 640 : this.minH);
